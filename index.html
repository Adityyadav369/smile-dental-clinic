<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile Dental Clinic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<img id="img"src="https://img.magnific.com/premium-photo/dental-clinic-background-out-focus_1162810-25176.jpg?semt=ais_hybrid&w=740&q=80" alt="">
  <!-- 1. Clinic name and welcome message -->
  <header>
    <h1>Smile Dental Clinic</h1>
    <p>Welcome! We care for your teeth and your smile.</p>
  </header>

  <!-- 2. Appointment form -->
  <section>
    <h2>Book an Appointment</h2>
    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Time</label>
      <input type="time" id="time" name="time" required>

      <button type="submit">Book Now</button>
    </form>
  </section>

  <!-- 3. Clinic details -->
  <section>
    <h2>Visit Us</h2>
    <p><strong>Address:</strong> 123 Main Street, Your City</p>
    <p><strong>Opening Hours:</strong> Mon - Sat, 9:00 AM - 6:00 PM</p>
    <p><strong>Phone:</strong> +91 98765 43210</p>
  </section>

  <!-- 4. Footer -->
  <footer>
    <p>&copy; 2026 Smile Dental Clinic. All rights reserved.</p>
  </footer>

</body>
</html>
